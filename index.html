<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2329">
<title>Schilder-Scanner</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<main>
  <h1>Schilder-Scanner</h1>
  <p id="status">Kamera starten oder ein Foto wählen.</p>
  <div class="stage">
    <canvas id="view" width="640" height="480"></canvas>
    <!-- Das Video wird nie angezeigt, nur als Bildquelle für das Canvas genutzt -->
    <video id="video" playsinline muted></video>
  </div>
  <div class="row">
    <button id="camBtn" type="button">Kamera starten</button>
    <label class="btn">Foto wählen<input id="file" type="file" accept="image/*"></label>
  </div>
  <div class="row tune">
    <label>Farbstrenge <input id="sat" type="range" min="0.35" max="0.8" step="0.05" value="0.5"> <output id="satOut">0.50</output></label>
    <label id="sizeRow" hidden>KI-Eingang
      <select id="size">
        <option value="auto" selected>automatisch</option>
        <option value="256">256 px (schnell)</option>
        <option value="320">320 px</option>
        <option value="384">384 px (genauer)</option>
        <option value="448">448 px (Foto, langsam)</option>
      </select>
    </label>
    <label><input id="maskCb" type="checkbox"> Farbmasken zeigen</label>
  </div>
  <ul id="list"></ul>
</main>
<script src="src/detector.js"></script>
<!-- Optionaler KI-Modus: ONNX Runtime Web. Fehlt das Skript (offline), läuft die Heuristik weiter. -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.min.js" crossorigin="anonymous"></script>
<script src="src/model.js"></script>
<script src="src/app.js"></script>
</body>
</html>
