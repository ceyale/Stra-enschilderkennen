<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oberflächen-Test – Schilder-Scanner</title>
<style>
  body { margin: 0; padding: 24px; background: #1e2329; color: #f1f0ea;
    font: 15px/1.6 Bahnschrift, "DIN Alternate", system-ui, sans-serif; }
  h1 { font-size: 1.3rem; }
  #result { background: #2a3138; padding: 16px; border-radius: 6px; white-space: pre-wrap; font-size: .9rem; }
  iframe { width: 420px; height: 560px; border: 0; background: #000; border-radius: 6px; }
</style>
</head>
<body>
<h1>Oberflächen-Test</h1>
<p>Lädt <code>index.html</code> und speist ein synthetisch gezeichnetes Foto in den Datei-Knopf ein.
   Der Test braucht einen lokalen Server, weil das Fenster sonst nicht auf die Seite zugreifen darf:<br>
   <code>python -m http.server 8000</code> → <code>http://localhost:8000/tests/app.test.html</code></p>
<iframe id="app" src="../index.html" title="Schilder-Scanner"></iframe>
<pre id="result">läuft …</pre>
<script>
(function () {
  'use strict';
  const steps = [];
  const check = (name, ok, detail) => steps.push({ name, ok: !!ok, detail: detail || '' });
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /** Wie lange auf das Ergebnis warten (großzügig: Handys sind langsam). */
  const TIMEOUT_MS = 3000;

  function report() {
    const failed = steps.filter(s => !s.ok);
    const head = 'Oberflächen-Test: ' + (steps.length - failed.length) + '/' + steps.length +
      ' bestanden' + (failed.length ? ' – FEHLER' : ' – OK');
    document.title = head;
    document.getElementById('result').textContent = head + '\n\n' +
      steps.map(s => (s.ok ? 'PASS ' : 'FAIL ') + s.name + (s.ok || !s.detail ? '' : ' → ' + s.detail)).join('\n');
  }

  /** Verbotszeichen malen: roter Ring auf grauem Grund (200 × 200). */
  function signImage() {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 200;
    const c = cv.getContext('2d');
    c.fillStyle = '#808080'; c.fillRect(0, 0, 200, 200);
    c.strokeStyle = '#c81e28'; c.lineWidth = 24;
    c.beginPath(); c.arc(100, 100, 70, 0, Math.PI * 2); c.stroke();
    return cv;
  }

  async function run() {
    const doc = document.getElementById('app').contentDocument;
    const list = doc.getElementById('list'), status = doc.getElementById('status');
    const saveBtn = doc.getElementById('saveBtn');

    check('Liste zeigt im Startzustand den Hinweis', /Noch kein Schild/.test(list.textContent));
    check('„Bild speichern“ ist anfangs gesperrt', saveBtn.disabled);
    check('Statuszeile ist gefüllt', status.textContent.length > 10, status.textContent);

    // Foto über den echten Datei-Knopf einspeisen (DataTransfer, wie es der Browser tut).
    const res = await fetch(signImage().toDataURL('image/png'));
    const file = new File([await res.blob()], 'test.png', { type: 'image/png' });
    const dt = new DataTransfer();
    dt.items.add(file);
    const input = doc.getElementById('file');
    input.files = dt.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));

    const t0 = performance.now();
    while (performance.now() - t0 < TIMEOUT_MS && !/Verbotszeichen/.test(list.textContent)) await wait(50);

    check('Foto wird analysiert: Verbotszeichen erkannt', /Verbotszeichen/.test(list.textContent),
      list.textContent.slice(0, 60));
    check('Liste nennt Sicherheit in Prozent', /%/.test(list.textContent));
    check('„Bild speichern“ ist jetzt aktiv', !saveBtn.disabled);
    check('Statuszeile nennt die Analysezeit', /ms/.test(status.textContent), status.textContent);
    check('Anzeige übernimmt das Seitenverhältnis des Fotos',
      doc.getElementById('view').height === 640, 'Höhe ' + doc.getElementById('view').height);

    doc.getElementById('resetBtn').click();
    await wait(100);
    check('„Zurücksetzen“ räumt die Liste auf', /Noch kein Schild/.test(list.textContent));
    check('„Zurücksetzen“ sperrt das Speichern wieder', saveBtn.disabled);
    check('„Zurücksetzen“ setzt die Statuszeile zurück',
      /Kamera starten|Foto wählen/.test(status.textContent), status.textContent);

    // Reichweite umstellen darf nicht abstürzen und die Analyse erneut auslösen.
    const res2 = doc.getElementById('res');
    res2.value = '160';
    res2.dispatchEvent(new Event('change', { bubbles: true }));
    await wait(100);
    check('Reichweite lässt sich umstellen', res2.value === '160');
  }

  const frame = document.getElementById('app');
  // Beim Laden dieses Skripts ist das Fenster oft noch „about:blank“ – deshalb auf index.html warten.
  const appDoc = () => (frame.contentDocument && frame.contentDocument.getElementById('view')) ? frame.contentDocument : null;
  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    run().then(report).catch(err => {
      check('Testlauf ohne Fehler', false, (err && err.message) || String(err));
      report();
    });
  };
  if (appDoc()) start();
  else frame.addEventListener('load', start);
})();
</script>
</body>
</html>
